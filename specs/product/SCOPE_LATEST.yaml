core_value: "Single Todo React frontend consumed by all language canaries via sync-shell.sh v2."

summary: |
  Repository **appwrite-canary-shell**. Hosts **`app/`** — the Shadcn Todo SPA lifted from the Node pilot.
  Consumers: node, python, php, go (static Vite build to each Site).
  Version line: `feat!` e03 ships shell 2.x and retires `prototype/ds` as default sync payload.

in_scope:
  - Epic e03 — Todo app in `app/`, Vite env, sync-shell v2
  - Epics e01–e02 historical (footer schema, release)
  - `npm test` + `npm run build` in shell CI
  - docs/NEW_PROJECT.md for consumer setup

out_of_scope:
  - Appwrite Functions (live in language repos)
  - TablesDB provision (program `provision-todo-resources.sh`)
  - Hello World as primary UI after e03

constraints:
  - Conventional Commits; no Co-authored-by
  - Breaking sync contract requires `feat!` and ADR note
  - Reference [`TODO_APP_REQUIREMENTS`](../../../specs/product/TODO_APP_REQUIREMENTS.md)

success_criteria:
  - e03s01: `app/` tests and build pass in shell repo
  - e03s02: footer obeys schema with VITE_* env
  - e03s03: sync-shell copies app; consumer temp build passes

references:
  - ../../../specs/program.yaml
  - ../../../specs/adr/ADR-ACAN-todo-parity.md
  - ../../../specs/product/TODO_APP_REQUIREMENTS.md